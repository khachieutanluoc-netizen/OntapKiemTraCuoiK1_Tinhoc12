name: Deploy to GitHub Pages

on:
  # Tự động chạy mỗi khi có code mới đẩy lên nhánh main
  push:
    branches: ["main"]
  # Cho phép kích hoạt chạy thủ công
  workflow_dispatch:

# Cấp quyền cho workflow để ghi dữ liệu lên Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cài đặt thư viện (Dependencies)
        run: bun install

      - name: Build ứng dụng
        run: bun run build

      - name: Đóng gói file tĩnh
        uses: actions/upload-pages-artifact@v3
        with:
          # Đảm bảo thư mục này khớp với thư mục xuất ra sau khi build (thường là dist hoặc build)
          path: './dist' 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
